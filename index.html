
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HAJIB SCANNER | الماسح الضوئي</title>

    <!-- إعدادات تطبيق الويب التقدمي (PWA) ومتوافقة مع نظام iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HAJIB SCAN">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5164/5164023.png">

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- مكتبة QR -->
    <script src="js/jsQR.js"></script> 

    <!-- الخطوط والأيقونات -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #818cf8;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --dark-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #a5b4fc 0%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle { font-size: 0.9rem; color: #94a3b8; }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 0 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 80px;
        }

        .mode-switch-container {
            margin: 20px 0;
            width: 100%;
        }
        
        #toggleModeButton {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--glass-border);
            margin-bottom: 25px;
        }

        #videoElement { width: 100%; height: 100%; object-fit: cover; }
        #detectionCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .scanner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            pointer-events: none;
        }
        .scanner-laser {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--success);
            box-shadow: 0 0 15px var(--success), 0 0 30px var(--success);
            top: 0;
            animation: scan 2.5s infinite linear;
            opacity: 0.6;
            display: none;
        }
        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }
        .corner-marker {
            position: absolute;
            width: 40px; height: 40px;
            border: 4px solid var(--secondary);
            border-radius: 4px;
            opacity: 0.8;
        }
        .tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        button { cursor: pointer; border: none; font-family: inherit; }

        .btn-primary {
            grid-column: span 2;
            background: linear-gradient(135deg, var(--primary), #4338ca);
            color: white;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary:active { transform: scale(0.98); }

        .btn-secondary {
            background: var(--card-bg);
            color: #cbd5e1;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-stop { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }

        #manualTicketLookup {
            display: none;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-top: 20px;
            border: 1px solid var(--glass-border);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; }}

        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            margin: 10px 0 15px;
            text-align: center;
        }
        input:focus { border-color: var(--secondary); }

        /* POPUP MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-card {
            background: #1e293b;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-overlay.active .modal-card { transform: scale(1); }

        .modal-icon { font-size: 4rem; margin-bottom: 20px; display: inline-block; }
        
        .loader-ring {
            width: 60px; height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; color: white; }
        .modal-desc { color: #94a3b8; font-size: 1rem; line-height: 1.6; margin-bottom: 25px; word-break: break-word; }
        .modal-desc strong { color: white; }

        .btn-modal {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: #334155;
            color: white;
            font-weight: 700;
            font-size: 1rem;
        }
        
        .state-success .modal-icon { color: var(--success); }
        .state-success .btn-modal { background: var(--success); }
        
        .state-error .modal-icon { color: var(--error); }
        .state-error .btn-modal { background: var(--error); }
        
        .state-warning .modal-icon { color: var(--warning); }
        .state-warning .btn-modal { background: var(--warning); }
    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-qrcode"></i> HAJIB TICKET</h1>
        <div class="subtitle">نظام التحقق الذكي</div>
    </header>

    <div class="app-container">
        
        <div class="mode-switch-container">
            <button id="toggleModeButton">
                <i class="fas fa-sync-alt"></i>
                <span id="modeText">الوضع الحالي: مسح للدخول</span>
            </button>
        </div>

        <div id="video-wrapper">
            <video id="videoElement" playsinline autoplay muted></video>
            <canvas id="detectionCanvas"></canvas>
            <canvas id="qrAnalysisCanvas" style="display: none;"></canvas>
            
            <div class="scanner-overlay">
                <div class="scanner-laser" id="scannerLaser"></div>
                <div class="corner-marker tl"></div>
                <div class="corner-marker tr"></div>
                <div class="corner-marker bl"></div>
                <div class="corner-marker br"></div>
            </div>
        </div>

        <!-- شاشة اختيار الفعالية في حال نسيان المعامِل في الرابط -->
        <div id="eventSelectionScreen" style="display: none; width: 100%; max-width: 480px; padding: 25px 20px; text-align: center; background: var(--card-bg); border-radius: 24px; border: 1px solid var(--glass-border); margin-top: 20px; animation: slideUp 0.3s ease;">
            <i class="fas fa-calendar-alt" style="font-size: 3.5rem; color: var(--secondary); margin-bottom: 15px; display: block;"></i>
            <h2 style="font-family: 'Cairo', sans-serif; font-size: 1.3rem; margin-bottom: 10px;">الرجاء اختيار الفعالية النشطة</h2>
            <p style="color: #cbd5e1; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.6;">لم يتم تحديد الفعالية في رابط الصفحة. الرجاء اختيار الفعالية للبدء في مسح التذاكر وتسجيل الحضور:</p>
            
            <div id="eventsListContainer" style="display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; padding-right: 5px;">
                <div style="color: #94a3b8;"><i class="fas fa-spinner fa-spin"></i> جاري تحميل قائمة الفعاليات...</div>
            </div>
        </div>

        <div id="loadingMessage" style="display:none; color:#94a3b8; margin-bottom:10px;">جاري إعداد الكاميرا...</div>

        <div class="controls-grid">
            <button id="startScanButton" class="btn-primary">
                <i class="fas fa-camera"></i> تشغيل الكاميرا
            </button>
            
            <button id="stopScanButton" class="btn-primary btn-stop" style="display: none;">
                <i class="fas fa-stop-circle"></i> إيقاف
            </button>

            <button id="showLookupButton" class="btn-secondary">
                <i class="fas fa-keyboard"></i> إدخال يدوي
            </button>
            <button onclick="location.reload()" class="btn-secondary">
                <i class="fas fa-redo"></i> تحديث
            </button>
        </div>

        <div id="manualTicketLookup">
            <label style="color: #cbd5e1; display: block; margin-bottom: 5px;">رقم التذكرة / الكود:</label>
            <input type="text" id="manualTicketId" placeholder="XXXXXXXX-XXXX">
            <button id="manualLookupButton" class="btn-primary" style="width:100%; background: var(--success);">
                <i class="fas fa-search"></i> تحقق الآن
            </button>
        </div>

        <div id="scan-status-wrapper" style="display: none;"></div>
    </div>

    <div id="resultModal" class="modal-overlay">
        <div class="modal-card">
            <div id="modalContent"></div>
            <button onclick="closeModal()" class="btn-modal" id="modalCloseBtn">اغلاق</button>
        </div>
    </div>

    <audio id="successSound" src="success.mp3" preload="auto"></audio>
    <audio id="errorSound" src="error.mp3" preload="auto"></audio>
    <audio id="usedSound" src="used.mp3" preload="auto"></audio>
    <audio id="infoSound" src="success.mp3" preload="auto"></audio>

    <script>
        const SUPABASE_URL = 'https://bigisnpdoqxmpjwpbncv.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_6ZtAL8lRYdreWg4Xhn6zLA_7-PwGvPJ'; 
        const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const eventSlug = urlParams.get('event');

        const video = document.getElementById('videoElement');
        const qrAnalysisCanvasElement = document.getElementById('qrAnalysisCanvas');
        const qrAnalysisCanvas = qrAnalysisCanvasElement.getContext('2d', { willReadFrequently: true });
        const detectionCanvasElement = document.getElementById('detectionCanvas');
        const detectionCanvas = detectionCanvasElement.getContext('2d');
        const videoWrapper = document.getElementById('video-wrapper');
        const scannerLaser = document.getElementById('scannerLaser');

        const loadingMessage = document.getElementById('loadingMessage');
        const startScanButton = document.getElementById('startScanButton');
        const stopScanButton = document.getElementById('stopScanButton');
        const toggleModeButton = document.getElementById('toggleModeButton');
        const manualLookupButton = document.getElementById('manualLookupButton');
        const showLookupButton = document.getElementById('showLookupButton');
        const manualTicketIdInput = document.getElementById('manualTicketId');

        const resultModal = document.getElementById('resultModal');
        const modalContent = document.getElementById('modalContent');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        const successSound = document.getElementById('successSound');
        const errorSound = document.getElementById('errorSound');
        const usedSound = document.getElementById('usedSound');
        const infoSound = document.getElementById('infoSound');
        const audioElements = [successSound, errorSound, usedSound, infoSound];
        
        let audioUnlocked = false;
        let stream = null;
        let animationFrameId = null;
        let processingQrCode = false;
        let currentOperationMode = 'scan';

        function unlockAudio() {
            if (audioUnlocked) return;
            audioElements.forEach(audio => {
                if (audio) { audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(() => {}); }
            });
            audioUnlocked = true;
        }

        function playSound(soundElement) {
            if (soundElement) {
                soundElement.currentTime = 0;
                soundElement.play().catch(e => console.warn(e));
            }
        }

        function showModalLoading(text) {
            resultModal.className = 'modal-overlay active';
            modalContent.parentElement.className = 'modal-card';
            modalCloseBtn.style.display = 'none';
            modalContent.innerHTML = `
                <div class="loader-ring"></div>
                <div class="modal-title">جاري المعالجة...</div>
                <div class="modal-desc">${text}</div>
            `;
        }

        function showModalResult(type, title, messageHtml) {
            resultModal.className = 'modal-overlay active';
            modalCloseBtn.style.display = 'block';
            modalCloseBtn.innerText = "اغلاق";

            let iconClass = "fa-info-circle";
            let stateClass = "state-info";

            if (type === 'success') {
                iconClass = "fa-check-circle";
                stateClass = "state-success";
            } else if (type === 'error') {
                iconClass = "fa-times-circle";
                stateClass = "state-error";
            } else if (type === 'warning') {
                iconClass = "fa-exclamation-triangle";
                stateClass = "state-warning";
            }

            modalContent.parentElement.className = `modal-card ${stateClass}`;
            modalContent.innerHTML = `
                <i class="fas ${iconClass} modal-icon"></i>
                <div class="modal-title">${title}</div>
                <div class="modal-desc">${messageHtml}</div>
            `;
        }

        function closeModal() {
            resultModal.classList.remove('active');
            processingQrCode = false;
            if (stream && stream.active) {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(tick);
            }
        }

        function drawLine(begin, end, color) {
            detectionCanvas.beginPath();
            detectionCanvas.moveTo(begin.x, begin.y);
            detectionCanvas.lineTo(end.x, end.y);
            detectionCanvas.lineWidth = 4;
            detectionCanvas.strokeStyle = color;
            detectionCanvas.lineCap = "round";
            detectionCanvas.stroke();
        }

        function tick() {
            if (processingQrCode) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                loadingMessage.style.display = 'none';
                scannerLaser.style.display = 'block';

                if (qrAnalysisCanvasElement.width !== video.videoWidth) {
                    qrAnalysisCanvasElement.width = video.videoWidth;
                    qrAnalysisCanvasElement.height = video.videoHeight;
                    detectionCanvasElement.width = videoWrapper.offsetWidth;
                    detectionCanvasElement.height = videoWrapper.offsetHeight;
                }

                qrAnalysisCanvas.drawImage(video, 0, 0, qrAnalysisCanvasElement.width, qrAnalysisCanvasElement.height);
                detectionCanvas.clearRect(0, 0, detectionCanvasElement.width, detectionCanvasElement.height);

                try {
                    const imageData = qrAnalysisCanvas.getImageData(0, 0, qrAnalysisCanvasElement.width, qrAnalysisCanvasElement.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                    if (code && code.data) {
                        const scaleX = detectionCanvasElement.width / qrAnalysisCanvasElement.width;
                        const scaleY = detectionCanvasElement.height / qrAnalysisCanvasElement.height;
                        
                        const loc = {
                            topLeft: { x: code.location.topLeftCorner.x * scaleX, y: code.location.topLeftCorner.y * scaleY },
                            topRight: { x: code.location.topRightCorner.x * scaleX, y: code.location.topRightCorner.y * scaleY },
                            bottomRight: { x: code.location.bottomRightCorner.x * scaleX, y: code.location.bottomRightCorner.y * scaleY },
                            bottomLeft: { x: code.location.bottomLeftCorner.x * scaleX, y: code.location.bottomLeftCorner.y * scaleY },
                        };

                        drawLine(loc.topLeft, loc.topRight, "#10b981");
                        drawLine(loc.topRight, loc.bottomRight, "#10b981");
                        drawLine(loc.bottomRight, loc.bottomLeft, "#10b981");
                        drawLine(loc.bottomLeft, loc.topLeft, "#10b981");

                        processingQrCode = true;
                        processScannedCode(code.data);
                    }
                } catch (err) { console.error(err); }
            }
            if (stream && stream.active) {
                animationFrameId = requestAnimationFrame(tick);
            }
        }

        async function startCamera() {
            unlockAudio();
            if (!eventSlug) {
                alert("الرجاء اختيار فعالية أولاً للتمكن من تشغيل الكاميرا.");
                return;
            }
            if (stream && stream.active) return;
            
            startScanButton.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> تشغيل...';
            loadingMessage.style.display = 'block';

            try {
                const constraints = { video: { facingMode: "environment" } };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    startScanButton.style.display = 'none';
                    stopScanButton.style.display = 'flex';
                    animationFrameId = requestAnimationFrame(tick);
                };
            } catch (err) {
                startScanButton.innerHTML = '<i class="fas fa-camera"></i> تشغيل الكاميرا';
                alert("تعذر الوصول للكاميرا: " + err.message);
            }
        }

        function stopCamera() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            scannerLaser.style.display = 'none';
            stopScanButton.style.display = 'none';
            startScanButton.style.display = 'flex';
            startScanButton.innerHTML = '<i class="fas fa-camera"></i> تشغيل الكاميرا';
            processingQrCode = false;
        }

        async function processScannedCode(qrCodeData) {
            if (!eventSlug) {
                showModalResult("error", "خطأ الفعالية", "لم يتم العثور على اسم الفعالية في رابط الماسح.");
                playSound(errorSound);
                return;
            }

            let actionText = (currentOperationMode === 'scan') ? 'جاري تسجيل الدخول وحفظ البيانات...' : 'جاري التحقق من التذكرة...';
            showModalLoading(`الكود: <strong>${qrCodeData}</strong><br>${actionText}`);

            try {
                const uuidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
                if (!uuidPattern.test(qrCodeData)) {
                    showModalResult("error", "تذكرة غير صالحة", "كود التذكرة غير معتمد في هذا النظام.");
                    playSound(errorSound);
                    return;
                }

                const { data: ticket, error } = await supa
                    .from('tickets')
                    .select('*')
                    .eq('id', qrCodeData)
                    .eq('event_slug', eventSlug)
                    .single();

                if (error || !ticket) {
                    showModalResult("error", "تذكرة غير موجودة", "الكود الممسوح غير مدرج في سجلات هذه الفعالية.");
                    playSound(errorSound);
                    return;
                }

                let title = "";
                let details = "";
                let type = "info";
                let sound = infoSound;

                if (currentOperationMode === 'scan') {
                    if (ticket.status === 'Attended') {
                        title = "التذكرة مستخدمة مسبقاً!";
                        const timeStr = ticket.arrival_time ? new Date(ticket.arrival_time).toLocaleString('ar-SA') : 'غير مسجل';
                        details = `الضيف الكريم: <strong>${ticket.guest_name}</strong><br>تم الدخول مسبقاً في: ${timeStr}`;
                        type = "warning";
                        sound = usedSound;
                    } else {
                        const now = new Date().toISOString();
                        const { error: updateError } = await supa
                            .from('tickets')
                            .update({ status: 'Attended', arrival_time: now })
                            .eq('id', qrCodeData);

                        if (updateError) throw updateError;

                        title = "تم تسجيل الحضور بنجاح";
                        details = `أهلاً وسهلاً بالضيف: <strong>${ticket.guest_name}</strong><br>تمت عملية المصادقة ودخولك مسجل بالخلفية.`;
                        type = "success";
                        sound = successSound;
                    }
                } else {
                    if (ticket.status === 'Attended') {
                        title = "تذكرة صالحة ومستعملة";
                        const timeStr = ticket.arrival_time ? new Date(ticket.arrival_time).toLocaleString('ar-SA') : 'غير مسجل';
                        details = `الضيف: <strong>${ticket.guest_name}</strong><br>تاريخ الدخول المسجل: ${timeStr}`;
                        type = "warning";
                        sound = usedSound;
                    } else {
                        title = "تذكرة صالحة وغير مستعملة";
                        details = `الضيف: <strong>${ticket.guest_name}</strong><br>التذكرة جاهزة ومعتمدة لتسجيل الدخول.`;
                        type = "success";
                        sound = infoSound;
                    }
                }

                showModalResult(type, title, details);
                playSound(sound);

            } catch (err) {
                showModalResult("error", "خطأ اتصال بالشبكة", "تعذر التحقق بسبب انقطاع الاتصال بخادم قاعدة البيانات.");
                playSound(errorSound);
            }
        }

        toggleModeButton.addEventListener('click', () => {
            unlockAudio();
            currentOperationMode = (currentOperationMode === 'scan') ? 'check' : 'scan';
            document.getElementById('modeText').innerText = currentOperationMode === 'scan' ? "الوضع الحالي: مسح للدخول" : "الوضع الحالي: تحقق من الصلاحية";
            toggleModeButton.style.borderColor = currentOperationMode === 'scan' ? 'var(--glass-border)' : 'var(--warning)';
        });

        startScanButton.addEventListener('click', startCamera);
        stopScanButton.addEventListener('click', stopCamera);

        showLookupButton.addEventListener('click', () => {
            const el = document.getElementById('manualTicketLookup');
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
            if(el.style.display === 'block') { stopCamera(); manualTicketIdInput.focus(); }
        });

        manualLookupButton.addEventListener('click', () => {
            const val = manualTicketIdInput.value.trim();
            if (val) processScannedCode(val);
        });

        // تسجيل الـ Service Worker لتطبيق الويب التقدمي (PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA Service Worker تم تسجيله بنجاح!', reg))
                    .catch(err => console.warn('فشل تسجيل PWA Service Worker:', err));
            });
        }

        // تشغيل فحص أولي عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', async () => {
            if (!eventSlug) {
                document.getElementById('video-wrapper').style.display = 'none';
                document.querySelector('.controls-grid').style.display = 'none';
                document.querySelector('.mode-switch-container').style.display = 'none';
                document.querySelector('.subtitle').innerText = "لم يتم تحديد فعالية نشطة";
                
                document.getElementById('eventSelectionScreen').style.display = 'block';
                await loadEventsForSelection();
            } else {
                updateModeButtonVisuals();
                document.querySelector('.subtitle').innerText = "الفعالية النشطة: " + eventSlug;
            }
        });

        async function loadEventsForSelection() {
            const container = document.getElementById('eventsListContainer');
            try {
                const { data, error } = await supa
                    .from('events')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                if (data.length === 0) {
                    container.innerHTML = '<div style="color:#ef4444; padding:15px;">لا توجد فعاليات مسجلة بالنظام حالياً. قم بإنشاء فعالية جديدة من لوحة المدير للبدء.</div>';
                    return;
                }

                container.innerHTML = '';
                data.forEach(ev => {
                    const btn = document.createElement('button');
                    btn.style.cssText = `
                        width: 100%;
                        padding: 14px;
                        background: rgba(255,255,255,0.05);
                        border: 1px solid var(--glass-border);
                        border-radius: 12px;
                        color: white;
                        text-align: right;
                        font-family: inherit;
                        font-weight: 600;
                        cursor: pointer;
                        transition: 0.2s;
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                    `;
                    btn.innerHTML = `
                        <span>${ev.title}</span>
                        <span style="font-size:0.85rem; color:var(--secondary); font-family:monospace;">دخول &larr;</span>
                    `;
                    btn.onmouseover = () => btn.style.background = 'rgba(255,255,255,0.1)';
                    btn.onmouseout = () => btn.style.background = 'rgba(255,255,255,0.05)';
                    btn.onclick = () => {
                        window.location.search = `?event=${ev.slug}`;
                    };
                    container.appendChild(btn);
                });
            } catch (e) {
                container.innerHTML = `<div style="color:#ef4444; padding:15px;">حدث خطأ أثناء تحميل الفعاليات. تأكد من اتصال الإنترنت.</div>`;
                console.error(e);
            }
        }

        function updateModeButtonVisuals() {
            const modeText = document.getElementById('modeText');
            if (currentOperationMode === 'scan') {
                modeText.innerText = "الوضع الحالي: مسح للدخول";
                toggleModeButton.style.borderColor = 'var(--glass-border)';
            } else {
                modeText.innerText = "الوضع الحالي: تحقق من الصلاحية";
                toggleModeButton.style.borderColor = 'var(--warning)';
            }
        }
    </script>
</body>
</html>
