
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAJIB | تسجيل الدخول</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: var(--panel);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        .logo-area {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 30px;
        }
        .form-group {
            text-align: right;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .form-control {
            width: 100%;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.2s;
        }
        .form-control:focus {
            border-color: var(--primary);
        }
        .btn-login {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login:hover { background: var(--primary-hover); }
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area"><i class="fas fa-qrcode"></i> HAJIB</div>
        <h2 style="margin-bottom: 20px; font-weight: 700;">تسجيل الدخول</h2>
        
        <div class="error-box" id="errorBox"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="text" id="email" class="form-control" required placeholder="name@example.com">
            </div>
            <div class="form-group" style="margin-bottom: 25px;">
                <label>كلمة المرور</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            <button class="btn-login" type="submit" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i> دخول للمنصة
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://bigisnpdoqxmpjwpbncv.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_6ZtAL8lRYdreWg4Xhn6zLA_7-PwGvPJ'; 
        const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const submitBtn = document.getElementById('submitBtn');

            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري التحقق...';

            try {
                const { data, error } = await supa
                    .from('profiles')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    throw new Error("بيانات الاعتماد المدخلة غير صحيحة");
                }

                if (data.status === 'suspended') {
                    throw new Error("عذراً، هذا الحساب معطل مؤقتاً لعدم سداد رسوم اشتراك الخدمة");
                }

                // حفظ بيانات الجلسة في المتصفح
                localStorage.setItem('hajibUser', JSON.stringify({
                    email: data.email,
                    role: data.role
                }));

                // توجيه المستخدم حسب الصلاحيات
                window.location.href = 'admin.html';

            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول للمنصة';
            }
        }
    </script>
</body>
</html>
