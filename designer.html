<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HAJIB | مصمم الدعوات</title>
    
    <!-- المكتبات الأساسية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { 
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 100%);
            --panel-bg: rgba(22, 30, 49, 0.75); 
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text: #f8fafc; 
            --text-muted: #94a3b8;
            --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border: rgba(255, 255, 255, 0.08); 
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none; 
            font-family: 'Tajawal', sans-serif;
        }

        body { 
            margin: 0; 
            background: #090d16;
            background-image: var(--bg-gradient);
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden; 
        }

        /* الهيكل الأساسي للتطبيق */
        .app-header {
            height: 60px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .brand { 
            font-weight: 800; 
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.2rem; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column; /* للجوال الافتراضي: الصورة أعلى والخيارات أسفل */
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* منطقة استعراض الكرت (أعلى في الجوال) */
        .preview-section {
            flex: 0 0 45vh; /* تأخذ 45% من مساحة الطول الرأسية في الهاتف */
            min-height: 280px;
            background: #050811;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
            border-bottom: 1px solid var(--border);
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4);
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas { 
            max-width: 100%; 
            max-height: 100%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            border-radius: 8px;
            object-fit: contain;
            cursor: move;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* لوحة التحكم والخيارات (أسفل في الجوال) */
        .controls-section {
            flex: 1;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.4);
            padding: 20px;
            padding-bottom: 40px;
        }

        .controls-grid {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* كروت الخيارات */
        .control-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .card-title i {
            color: var(--primary);
        }

        /* عناصر الإدخال المخصصة */
        .control-row { 
            margin-bottom: 15px; 
        }
        .control-row:last-child {
            margin-bottom: 0;
        }

        label { 
            display: flex; 
            justify-content: space-between; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            font-size: 0.9rem; 
            font-weight: 500;
        }

        label span {
            color: var(--primary);
            font-weight: bold;
        }
        
        /* مظهر شريط التمرير */
        input[type="range"] { 
            width: 100%; 
            height: 6px; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 5px; 
            appearance: none; 
            cursor: pointer; 
        }
        input[type="range"]::-webkit-slider-thumb { 
            appearance: none; 
            width: 18px; 
            height: 18px; 
            background: var(--primary); 
            border-radius: 50%; 
            border: 2px solid white; 
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }

        /* زر مخصص لرفع الملفات */
        .file-upload-wrapper {
            position: relative;
            width: 100%;
        }
        .file-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            color: var(--text-muted);
        }
        .file-upload-btn:hover {
            border-color: var(--primary);
            color: var(--text);
            background: rgba(139, 92, 246, 0.05);
        }

        /* منتقي الألوان */
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border);
            border-radius: 50%;
        }

        /* تخصيص زر التبديل السريع (Checkbox) */
        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { 
            opacity: 0; width: 0; height: 0; 
        }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155; transition: .3s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider {
            background-image: var(--primary-gradient);
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* تحويل راديو الاختيار إلى أزرار تفاعلية فخمة */
        .selector-group {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .selector-item {
            flex: 1;
            text-align: center;
        }
        .selector-item input[type="radio"] {
            display: none;
        }
        .selector-item label {
            display: block;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            margin: 0;
            justify-content: center;
        }
        .selector-item input[type="radio"]:checked + label {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        /* لوحة الأسهم للتوجيه */
        .arrow-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 140px;
            margin: 0 auto;
        }
        .btn-arrow {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: white;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-arrow:hover { 
            background: var(--primary-gradient); 
            border-color: transparent;
            transform: scale(1.05);
        }
        .btn-arrow:active {
            transform: scale(0.95);
        }

        /* صندوق التنقل وتحميل الملفات */
        .guest-nav-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .guest-select-wrapper {
            position: relative;
            width: 100%;
        }
        .guest-select-wrapper select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: white;
            font-size: 0.95rem;
            appearance: none;
            cursor: pointer;
        }
        .guest-select-wrapper::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .nav-buttons-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .btn-nav { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--border); 
            color: white; 
            width: 48px; 
            height: 48px; 
            border-radius: var(--radius-md); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.1rem; 
            transition: all 0.2s;
        }
        .btn-nav:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .counter-pill { 
            font-size: 0.95rem; 
            color: var(--text); 
            font-weight: bold;
            background: rgba(139, 92, 246, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        /* أزرار التحميل */
        .btn-action {
            width: 100%; 
            color: white; 
            border: none; 
            padding: 14px;
            border-radius: var(--radius-md); 
            font-weight: 700; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            font-size: 1rem; 
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }
        .btn-png {
            background: var(--success-gradient);
        }
        .btn-png:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
            transform: translateY(-1px);
        }
        .btn-zip {
            background: var(--primary-gradient);
        }
        .btn-zip:hover {
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
            transform: translateY(-1px);
        }
        .btn-action:active {
            transform: translateY(1px);
        }

        /* تلميح مساعدة الجوال */
        .touch-tip {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(139, 92, 246, 0.05);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(139, 92, 246, 0.1);
        }

        /* ==========================================
          تعديل الشاشات الكبيرة (أجهزة سطح المكتب والآيباد)
        ========================================== */
        @media (min-width: 1024px) {
            .app-main {
                flex-direction: row; /* يمين خيارات، ويسار الصورة */
            }
            .preview-section {
                flex: 1; /* الصورة تأخذ المساحة المتبقية */
                height: 100%;
                border-bottom: none;
                border-left: 1px solid var(--border);
            }
            .controls-section {
                width: 420px; /* عرض ثابت لوحة التحكم في الأجهزة الكبيرة */
                flex: none;
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand"><i class="fas fa-magic"></i> مصمم الدعوات</div>
    </header>

    <main class="app-main">
        <!-- قسم المعاينة (في الأعلى على الجوال) -->
        <section class="preview-section">
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
        </section>

        <!-- قسم الخيارات والتحكم (في الأسفل على الجوال) -->
        <section class="controls-section">
            <div class="controls-grid">
                
                <!-- الكرت 1: الخلفية والتصميم الأساسي -->
                <div class="control-card">
                    <div class="card-title">
                        <i class="fas fa-image"></i>
                        <span>1. قالب الدعوة</span>
                    </div>
                    <div class="control-row">
                        <div class="file-upload-wrapper">
                            <label for="bgInput" class="file-upload-btn">
                                <i class="fas fa-cloud-upload-alt" style="font-size: 1.2rem; color: var(--primary);"></i>
                                <span>اختر صورة الخلفية لتغييرها</span>
                            </label>
                            <input type="file" id="bgInput" accept="image/*" style="display: none;">
                        </div>
                    </div>
                </div>

                <!-- الكرت 2: خيارات الخط والاسم -->
                <div class="control-card">
                    <div class="card-title">
                        <i class="fas fa-user-tag"></i>
                        <span>2. اسم الضيف</span>
                    </div>
                    
                    <div class="control-row">
                        <div class="toggle-switch">
                            <span style="font-weight: 500; font-size: 0.95rem;">إظهار الاسم على الكرت</span>
                            <label class="switch">
                                <input type="checkbox" id="showName" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>

                    <div class="control-row">
                        <label>حجم خط الاسم <span><b id="val-textSize">40</b>px</span></label>
                        <input type="range" id="textSize" min="10" max="200" value="40">
                    </div>

                    <div class="control-row">
                        <label>لون الخط المفضل</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="textColor" value="#ffffff">
                            <span style="font-size: 0.85rem; color: var(--text-muted)">اضغط لتغيير اللون</span>
                        </div>
                    </div>
                </div>

                <!-- الكرت 3: خيارات الباركود QR -->
                <div class="control-card">
                    <div class="card-title">
                        <i class="fas fa-qrcode"></i>
                        <span>3. باركود QR</span>
                    </div>
                    <div class="control-row">
                        <label>حجم رمز الباركود <span><b id="val-qrSize">150</b>px</span></label>
                        <input type="range" id="qrSize" min="50" max="600" value="150">
                    </div>
                    <div class="control-row">
                        <div class="touch-tip">
                            <i class="fas fa-hand-pointer" style="color: var(--primary);"></i>
                            <span>تلميح: اسحب الباركود أو الاسم بإصبعك على الكرت لتغيير مكانه بسهولة.</span>
                        </div>
                    </div>
                </div>

                <!-- الكرت 4: أداة التحريك الدقيق والضبط -->
                <div class="control-card">
                    <div class="card-title">
                        <i class="fas fa-arrows-alt"></i>
                        <span>4. التحريك الدقيق</span>
                    </div>
                    <div class="control-row">
                        <div class="selector-group">
                            <div class="selector-item">
                                <input type="radio" name="activeElement" id="selectQR" checked>
                                <label for="selectQR"><i class="fas fa-qrcode"></i> الباركود</label>
                            </div>
                            <div class="selector-item">
                                <input type="radio" name="activeElement" id="selectName">
                                <label for="selectName"><i class="fas fa-font"></i> الاسم</label>
                            </div>
                        </div>
                        
                        <div class="arrow-controls">
                            <div></div>
                            <button class="btn-arrow" onclick="moveElement('up')"><i class="fas fa-chevron-up"></i></button>
                            <div></div>
                            <button class="btn-arrow" onclick="moveElement('left')"><i class="fas fa-chevron-left"></i></button>
                            <div style="display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight: bold; color: var(--text-muted);">ضبط</div>
                            <button class="btn-arrow" onclick="moveElement('right')"><i class="fas fa-chevron-right"></i></button>
                            <div></div>
                            <button class="btn-arrow" onclick="moveElement('down')"><i class="fas fa-chevron-down"></i></button>
                            <div></div>
                        </div>
                    </div>
                </div>

                <!-- الكرت 5: التنقل والتحميل -->
                <div class="control-card" style="margin-bottom: 20px;">
                    <div class="card-title">
                        <i class="fas fa-tasks"></i>
                        <span>5. الإجراءات والتحميل</span>
                    </div>
                    <div class="control-row guest-nav-box">
                        <div class="guest-select-wrapper">
                            <select id="guestSelect" onchange="jumpToGuest()">
                                <option>جاري التحميل...</option>
                            </select>
                        </div>
                        
                        <div class="nav-buttons-row">
                            <button class="btn-nav" onclick="nextGuest()"><i class="fas fa-chevron-right"></i></button>
                            <span class="counter-pill" id="counterDisplay">0 / 0</span>
                            <button class="btn-nav" onclick="prevGuest()"><i class="fas fa-chevron-left"></i></button>
                        </div>
                    </div>
                    
                    <div class="control-row" style="display:flex; flex-direction:column; gap:12px; margin-top:20px;">
                        <button class="btn-action btn-png" onclick="downloadCurrentPNG()">
                            <i class="fas fa-download"></i> تحميل البطاقة الحالية (PNG)
                        </button>
                        <button class="btn-action btn-zip" onclick="downloadAllInZip()" id="btnZip">
                            <i class="fas fa-file-archive"></i> تحميل الكل ملف مضغوط (ZIP)
                        </button>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <div id="hiddenQR" style="display:none;"></div>

    <script>
        const SUPABASE_URL = 'https://bigisnpdoqxmpjwpbncv.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_6ZtAL8lRYdreWg4Xhn6zLA_7-PwGvPJ'; 
        const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const eventSlug = urlParams.get('event');

        let guests = [];
        let currentIndex = 0;
        let bgImg = new Image();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const state = {
            qrSize: 150, 
            qrX: 100, 
            qrY: 100,
            showName: true, 
            textSize: 40, 
            textX: 300, 
            textY: 450, 
            textColor: '#ffffff'
        };

        let isDragging = false;
        let dragElement = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        bgImg.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+gAAALQCAIAAACw5t5xAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABTSURBVHhe7cExAQAAAMKg9U9tDQ8gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4McIsHgAAa1w1XEAAAAASUVORK5CYII=";
        bgImg.onload = renderCurrentGuest;

        async function fetchData() {
            if (!eventSlug) {
                alert("الرجاء تحديد معامل الفعالية ?event=slug في الرابط");
                return;
            }
            try {
                const { data, error } = await supa
                    .from('tickets')
                    .select('*')
                    .eq('event_slug', eventSlug)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                guests = data.map(g => ({ name: g.guest_name, qrCode: g.id }));
                if (guests.length > 0) {
                    populateDropdown();
                    updateUI();
                    renderCurrentGuest();
                } else {
                    document.getElementById('guestSelect').innerHTML = '<option>لا يوجد مدعوون للفعالية</option>';
                }
            } catch(e) { console.error(e); }
        }

        function populateDropdown() {
            const sel = document.getElementById('guestSelect'); sel.innerHTML = '';
            guests.forEach((g, i) => {
                const opt = document.createElement('option');
                opt.value = i; opt.innerText = `${i+1}. ${g.name}`;
                sel.appendChild(opt);
            });
        }
        function updateUI() {
            if (guests.length === 0) return;
            document.getElementById('counterDisplay').innerText = `${currentIndex + 1} / ${guests.length}`;
            document.getElementById('guestSelect').value = currentIndex;
        }

        window.nextGuest = () => { if(currentIndex < guests.length-1) { currentIndex++; updateUI(); renderCurrentGuest(); } };
        window.prevGuest = () => { if(currentIndex > 0) { currentIndex--; updateUI(); renderCurrentGuest(); } };
        window.jumpToGuest = () => { currentIndex = parseInt(document.getElementById('guestSelect').value); updateUI(); renderCurrentGuest(); };

        async function renderCurrentGuest() {
            if(guests.length === 0) return;
            const guest = guests[currentIndex];

            const tempDiv = document.getElementById('hiddenQR'); tempDiv.innerHTML = '';
            new QRCode(tempDiv, { text: guest.qrCode, width: state.qrSize, height: state.qrSize });
            await new Promise(r => setTimeout(r, 80));
            const qrImg = tempDiv.querySelector('img');

            canvas.width = bgImg.width || 800; canvas.height = bgImg.height || 600;
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

            const padding = 10; 
            const boxX = state.qrX - padding;
            const boxY = state.qrY - padding;
            const boxSize = state.qrSize + (padding * 2);

            // رسم خلفية الباركود البيضاء
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(boxX, boxY, boxSize, boxSize);

            if(qrImg) {
                ctx.drawImage(qrImg, state.qrX, state.qrY, state.qrSize, state.qrSize);
            } else {
                ctx.fillStyle = "#000"; ctx.fillRect(state.qrX, state.qrY, state.qrSize, state.qrSize);
            }

            if(state.showName) {
                ctx.font = `bold ${state.textSize}px 'Tajawal'`;
                ctx.fillStyle = state.textColor;
                ctx.textAlign = 'right';
                ctx.fillText(guest.name, state.textX, state.textY);
            }

            // رسم إطار توجيهي متقطع حول العنصر المحدد لتسهيل تجربة التعديل
            const isQRSelected = document.getElementById('selectQR').checked;
            ctx.save();
            ctx.strokeStyle = '#8b5cf6';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 4]);

            if (isQRSelected) {
                // رسم التحديد حول الباركود
                ctx.strokeRect(state.qrX - 5, state.qrY - 5, state.qrSize + 10, state.qrSize + 10);
            } else if (state.showName) {
                // رسم التحديد حول النص المكتوب
                ctx.font = `bold ${state.textSize}px 'Tajawal'`;
                const textWidth = ctx.measureText(guest.name).width;
                ctx.strokeRect(state.textX - textWidth - 5, state.textY - state.textSize, textWidth + 10, state.textSize + 10);
            }
            ctx.restore();
        }

        function getCanvasMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function checkHitElement(pos) {
            if (pos.x >= state.qrX && pos.x <= state.qrX + state.qrSize &&
                pos.y >= state.qrY && pos.y <= state.qrY + state.qrSize) {
                return 'qr';
            }
            if (state.showName) {
                const textWidth = ctx.measureText(guests[currentIndex].name).width;
                if (pos.x >= state.textX - textWidth && pos.x <= state.textX &&
                    pos.y >= state.textY - state.textSize && pos.y <= state.textY) {
                    return 'name';
                }
            }
            return null;
        }

        function startDrag(e) {
            const pos = getCanvasMousePos(e);
            const hit = checkHitElement(pos);
            if (hit) {
                isDragging = true;
                dragElement = hit;
                if (hit === 'qr') {
                    dragOffsetX = pos.x - state.qrX;
                    dragOffsetY = pos.y - state.qrY;
                    document.getElementById('selectQR').checked = true;
                } else {
                    dragOffsetX = pos.x - state.textX;
                    dragOffsetY = pos.y - state.textY;
                    document.getElementById('selectName').checked = true;
                }
                renderCurrentGuest();
            }
        }

        function doDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const pos = getCanvasMousePos(e);
            if (dragElement === 'qr') {
                state.qrX = Math.round(pos.x - dragOffsetX);
                state.qrY = Math.round(pos.y - dragOffsetY);
            } else if (dragElement === 'name') {
                state.textX = Math.round(pos.x - dragOffsetX);
                state.textY = Math.round(pos.y - dragOffsetY);
            }
            renderCurrentGuest();
        }

        function endDrag() {
            isDragging = false;
            dragElement = null;
        }

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('mousemove', doDrag);
        canvas.addEventListener('mouseup', endDrag);
        canvas.addEventListener('touchstart', startDrag, { passive: false });
        canvas.addEventListener('touchmove', doDrag, { passive: false });
        canvas.addEventListener('touchend', endDrag);

        function moveElement(dir) {
            const isQR = document.getElementById('selectQR').checked;
            const step = 5;
            if (isQR) {
                if (dir === 'up') state.qrY -= step;
                if (dir === 'down') state.qrY += step;
                if (dir === 'left') state.qrX -= step;
                if (dir === 'right') state.qrX += step;
            } else {
                if (dir === 'up') state.textY -= step;
                if (dir === 'down') state.textY += step;
                if (dir === 'left') state.textX -= step;
                if (dir === 'right') state.textX += step;
            }
            renderCurrentGuest();
        }

        const bind = (id) => {
            document.getElementById(id).addEventListener('input', (e) => {
                let val = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
                if (e.target.type === 'range') val = parseInt(val);
                state[id] = val;
                if (document.getElementById('val-' + id)) document.getElementById('val-' + id).innerText = val;
                renderCurrentGuest();
            });
        };
        ['qrSize', 'textSize', 'textColor', 'showName'].forEach(bind);

        // ربط مستمعات الأحداث لتغيير الإطار المتقطع فور اختيار راديو "الاسم" أو "الباركود"
        document.getElementById('selectQR').addEventListener('change', renderCurrentGuest);
        document.getElementById('selectName').addEventListener('change', renderCurrentGuest);

        document.getElementById('bgInput').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                const r = new FileReader();
                r.onload = (ev) => {
                    bgImg = new Image();
                    bgImg.onload = () => {
                        renderCurrentGuest();
                    };
                    bgImg.src = ev.target.result;
                };
                r.readAsDataURL(e.target.files[0]);
            }
        });

        function downloadCurrentPNG() {
            if (guests.length === 0) return;
            // حجب الإطار المتقطع مؤقتاً عند التصدير للـ PNG
            renderWithoutSelectionAndExecute(() => {
                canvas.toBlob(blob => saveAs(blob, `${guests[currentIndex].name.replace(/[^a-z0-9\u0600-\u06FF]/gi, "_")}.png`), "image/png", 1.0);
            });
        }

        async function downloadAllInZip() {
            if (guests.length === 0) return alert("لا يوجد مدعوون لتصدير بطاقاتهم");
            const btn = document.getElementById('btnZip');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري إعداد الملف المضغوط...';
            btn.disabled = true;

            const zip = new JSZip();
            const originalIndex = currentIndex;

            for (let i = 0; i < guests.length; i++) {
                currentIndex = i;
                await renderWithoutSelectionAndExecute(async () => {
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 1.0));
                    const safeName = guests[i].name.replace(/[^a-z0-9\u0600-\u06FF]/gi, "_");
                    zip.file(`${i + 1}_${safeName}.png`, blob);
                });
            }

            currentIndex = originalIndex;
            await renderCurrentGuest();
            updateUI();

            zip.generateAsync({ type: 'blob' }).then(content => {
                saveAs(content, `دعوات_${eventSlug || 'الحفل'}.zip`);
                btn.innerHTML = '<i class="fas fa-file-archive"></i> تحميل الكل ملف مضغوط (ZIP)';
                btn.disabled = false;
            });
        }

        // دالة مساعدة لتعطيل إطار التحديد التوجيهي مؤقتاً أثناء التصدير والتحميل لكي لا يظهر في الصورة النهائية للضيف
        async function renderWithoutSelectionAndExecute(callback) {
            const guest = guests[currentIndex];
            const tempDiv = document.getElementById('hiddenQR'); tempDiv.innerHTML = '';
            new QRCode(tempDiv, { text: guest.qrCode, width: state.qrSize, height: state.qrSize });
            await new Promise(r => setTimeout(r, 80));
            const qrImg = tempDiv.querySelector('img');

            canvas.width = bgImg.width || 800; canvas.height = bgImg.height || 600;
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

            const padding = 10; 
            const boxX = state.qrX - padding;
            const boxY = state.qrY - padding;
            const boxSize = state.qrSize + (padding * 2);

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(boxX, boxY, boxSize, boxSize);

            if(qrImg) {
                ctx.drawImage(qrImg, state.qrX, state.qrY, state.qrSize, state.qrSize);
            } else {
                ctx.fillStyle = "#000"; ctx.fillRect(state.qrX, state.qrY, state.qrSize, state.qrSize);
            }

            if(state.showName) {
                ctx.font = `bold ${state.textSize}px 'Tajawal'`;
                ctx.fillStyle = state.textColor;
                ctx.textAlign = 'right';
                ctx.fillText(guest.name, state.textX, state.textY);
            }

            await callback();
        }

        fetchData();
    </script>
</body>
