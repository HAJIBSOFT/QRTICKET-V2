<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تذكرة</title>
    
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --accent: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #fbbf24;
            --st-valid: #10b981;
            --st-used: #f59e0b;
            --st-invalid: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .ticket-container { position: relative; width: 100%; max-width: 360px; display: none; }
        .ticket-container.visible { display: block; }

        .ticket-card {
            background: var(--card-bg);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .ticket-header { padding: 40px 20px 20px; text-align: center; }
        .event-title { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 1.8rem; color: white; margin-bottom: 5px; }
        .guest-name { font-family: 'Cairo', sans-serif; font-size: 2rem; font-weight: 700; color: white; margin-bottom: 10px; }
        .ticket-footer { background: rgba(0, 0, 0, 0.2); padding: 30px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .qr-frame { background: white; padding: 10px; border-radius: 15px; margin-bottom: 15px; }
        
        /* تنسيق زر آيفون */
        #appleWalletContainer { display: none; margin-top: 20px; width: 100%; }
        .apple-wallet-button {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #444;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }
        .apple-wallet-button:active { transform: scale(0.97); }
        .apple-wallet-button img { height: 20px; margin-left: 10px; }

        .status-indicator { padding: 8px 24px; border-radius: 50px; font-weight: bold; border: 1px solid rgba(255, 255, 255, 0.1); }
        .st-valid .status-indicator { color: var(--st-valid); border-color: var(--st-valid); }
        .st-used .status-indicator { color: var(--st-used); border-color: var(--st-used); }
        .st-invalid .status-indicator { color: var(--st-invalid); border-color: var(--st-invalid); }

        #loadingIndicator { text-align: center; }
        .loader { width: 40px; height: 40px; border: 3px solid #fff; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingIndicator">
        <span class="loader"></span>
        <p style="color: var(--text-muted); margin-top: 10px;">جاري تجهيز التذكرة...</p>
    </div>

    <div class="ticket-container" id="ticketContainer">
        <div class="ticket-card" id="ticketCard">
            <div class="ticket-header">
                <i class="fas fa-crown" style="color: var(--gold); font-size: 2rem;"></i>
                <div class="event-title" id="eventTitle">...</div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">يرجى إبراز الدعوة عند الدخول</div>
            </div>

            <div style="padding: 20px; text-align: center;">
                <span style="color: var(--accent); font-weight: bold; font-size: 0.8rem;">حامل الدعوة</span>
                <div class="guest-name" id="guestName">...</div>
            </div>

            <div class="ticket-footer">
                <div class="qr-frame">
                    <div id="qrcodeDisplay"></div>
                </div>
                <div id="ticketIdText" style="color: var(--text-muted); font-size: 0.7rem; margin-bottom: 15px;">ID: ...</div>
                <div class="status-indicator" id="statusBadge">جاري التحقق...</div>

                <!-- زر محفظة أبل -->
                <div id="appleWalletContainer">
                    <button onclick="addToAppleWallet()" class="apple-wallet-button" id="walletBtn">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b2/Add_to_Apple_Wallet_logo.svg" alt="Apple Wallet">
                        إضافة إلى المحفظة
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxDCG5Qmb5_WgoYof2Us1I-RJXft2HY2DQhWl-7WclA-JnGf6ee-2YkoGVSS00YOGpw/exec'; // ضع رابط الـ Web App الخاص بك هنا

        let currentGuestName = "";
        let currentQrData = "";

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const qrDataParam = urlParams.get('qrData');
            const eventNameParam = urlParams.get('eventName') || "تذكرة خاصة";

            if (!qrDataParam) return;

            // التحقق إذا كان الجهاز آيفون لإظهار الزر
            const isIPhone = /iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIPhone) {
                document.getElementById('appleWalletContainer').style.display = 'block';
            }

            fetch(`${GOOGLE_SCRIPT_URL}?action=getTicketData&qrData=${encodeURIComponent(qrDataParam)}&eventName=${encodeURIComponent(eventNameParam)}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    document.getElementById('ticketContainer').classList.add('visible');

                    if (data.success) {
                        currentGuestName = data.guestName;
                        currentQrData = data.qrData;
                        
                        document.getElementById('eventTitle').innerText = data.eventName;
                        document.getElementById('guestName').innerText = data.guestName;
                        document.getElementById('ticketIdText').innerText = "ID: " + data.qrData;

                        new QRCode(document.getElementById('qrcodeDisplay'), {
                            text: data.qrData,
                            width: 140, height: 140
                        });

                        updateStatusBadge(data.ticketStatus);
                    }
                });
        });

        function updateStatusBadge(status) {
            const badge = document.getElementById('statusBadge');
            const card = document.getElementById('ticketCard');
            status = (status || '').toLowerCase();

            if (status.includes('valid') || status.includes('صالحة')) {
                card.classList.add('st-valid');
                badge.innerHTML = "تذكرة صالحة";
            } else if (status.includes('attended') || status.includes('مستخدمة')) {
                card.classList.add('st-used');
                badge.innerHTML = "تم الحضور";
            } else {
                card.classList.add('st-invalid');
                badge.innerHTML = "غير صالحة";
            }
        }

        async function addToAppleWallet() {
            const btn = document.getElementById('walletBtn');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = "جاري التجهيز...";

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAppleWalletPass&qrData=${encodeURIComponent(currentQrData)}&guestName=${encodeURIComponent(currentGuestName)}`);
                const result = await response.json();

                if (result.success) {
                    // تحويل Base64 إلى ملف وتحميله
                    const byteCharacters = atob(result.fileData);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], {type: 'application/vnd.apple.pkpass'});
                    
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = result.fileName;
                    a.click();
                } else {
                    alert("فشل إنشاء التذكرة");
                }
            } catch (e) {
                alert("حدث خطأ في الاتصال");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }
    </script>
</body>
</html>
