<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تذكرة</title>
    
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #020617;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --accent: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #fbbf24;
            --st-valid: #10b981;
            --st-used: #f59e0b;
            --st-invalid: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .ticket-container { position: relative; width: 100%; max-width: 360px; display: none; animation: popIn 0.6s ease-out; }
        .ticket-container.visible { display: block; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .ticket-card { background: var(--card-bg); border-radius: 30px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
        .ticket-header { padding: 40px 20px 20px; text-align: center; }
        .logo-icon { font-size: 2rem; color: var(--gold); margin-bottom: 10px; }
        .event-title { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 1.8rem; color: white; }
        .ticket-body { padding: 20px; text-align: center; }
        .guest-name { font-family: 'Cairo', sans-serif; font-size: 2rem; font-weight: 700; color: white; margin-bottom: 15px; }

        .ticket-footer { background: rgba(0, 0, 0, 0.2); padding: 30px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .qr-frame { background: white; padding: 12px; border-radius: 18px; margin-bottom: 15px; }

        .status-indicator { padding: 8px 24px; border-radius: 50px; font-weight: bold; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 15px; }
        .st-valid .status-indicator { color: var(--st-valid); border-color: var(--st-valid); }
        .st-used .status-indicator { color: var(--st-used); border-color: var(--st-used); }
        .st-invalid .status-indicator { color: var(--st-invalid); border-color: var(--st-invalid); }

        /* تنسيق زر آيفون */
        #appleWalletContainer { display: none; margin-top: 10px; }
        .apple-wallet-button { background: none; border: none; cursor: pointer; transition: transform 0.2s; }
        .apple-wallet-button:active { transform: scale(0.95); }
        .apple-wallet-button img { width: 180px; height: auto; }

        #loadingIndicator { text-align: center; }
        .loader { width: 40px; height: 40px; border: 3px solid #fff; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingIndicator">
        <span class="loader"></span>
        <p style="color: var(--text-muted); margin-top: 15px;">جاري تحميل التذكرة...</p>
    </div>

    <div class="ticket-container" id="ticketContainer">
        <div class="ticket-card" id="ticketCard">
            <div class="ticket-header">
                <i class="fas fa-crown logo-icon"></i>
                <div class="event-title" id="eventTitle">...</div>
            </div>

            <div class="ticket-body">
                <span style="color: var(--accent); font-size: 0.8rem; font-weight: bold;">حامل الدعوة</span>
                <div class="guest-name" id="guestName">...</div>
            </div>

            <div class="ticket-footer">
                <div class="qr-frame"><div id="qrcodeDisplay"></div></div>
                <div id="ticketIdText" style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 15px;">ID: ...</div>
                <div class="status-indicator" id="statusBadge">جاري التحقق...</div>

                <div id="appleWalletContainer">
                    <button onclick="addToAppleWallet()" class="apple-wallet-button" id="walletBtn">
                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhoXzwbsszXm6o4CnAGon7WqRGEQUpuhM057aAAyU6QZE77KlI6JLfNh2nPG4Bhkbjvj08GstICO0IUNJJuFBg-Xn1JnrMZbBF8DGeudBSv7q9D8YXhgB8outcHSMleh2h8DolK6M9CB70SdFsZm2xW29akyhQDkc2c7TigkDMudtz1dC2GBtBjiIRHJKbN/s3840/Add_to_Apple_Wallet_badge.svg.png" alt="Add to Apple Wallet">
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // رابط السكربت الخاص بك لجلب بيانات التذكرة فقط
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzNf9xpB99tioPUwYnjRlmF_3VECNCHfzPnRYbvPpoM8srwxdzlx7Xbezz3VxQ-0onX/exec';

        let currentTicket = null;

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const qrData = urlParams.get('qrData');
            
            if (!qrData) return;

            // إظهار الزر في الآيفون فقط
            const isIPhone = /iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (isIPhone) document.getElementById('appleWalletContainer').style.display = 'block';

            fetch(`${GOOGLE_SCRIPT_URL}?action=getTicketData&qrData=${encodeURIComponent(qrData)}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    if (data.success) {
                        currentTicket = data;
                        document.getElementById('ticketContainer').classList.add('visible');
                        document.getElementById('eventTitle').innerText = data.eventName;
                        document.getElementById('guestName').innerText = data.guestName;
                        document.getElementById('ticketIdText').innerText = "ID: " + data.qrData;
                        new QRCode(document.getElementById('qrcodeDisplay'), { text: data.qrData, width: 140, height: 140 });
                        updateUI(data.ticketStatus);
                    }
                });
        });

        function updateUI(status) {
            const badge = document.getElementById('statusBadge');
            const card = document.getElementById('ticketCard');
            status = status.toLowerCase();
            if (status.includes('valid') || status.includes('صالحة')) {
                card.classList.add('st-valid'); badge.innerText = "تذكرة صالحة";
            } else if (status.includes('attended')) {
                card.classList.add('st-used'); badge.innerText = "تم الحضور";
            } else {
                card.classList.add('st-invalid'); badge.innerText = "غير صالحة";
            }
        }

        // كود الـ API الخاص بـ WalletWallet مباشرة في الصفحة
        async function addToAppleWallet() {
            if (!currentTicket) return;
            const btn = document.getElementById('walletBtn');
            btn.style.opacity = "0.5";

            try {
                const response = await fetch('https://api.walletwallet.dev/api/pkpass', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ww_live_d725637056c71ad72de934242e861523'
                    },
                    body: JSON.stringify({
                        barcodeValue: currentTicket.qrData,
                        barcodeFormat: "QR",
                        title: currentTicket.guestName,
                        colorPreset: "dark"
                    })
                });

                if (!response.ok) throw new Error('API Error');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ticket.pkpass';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (e) {
                alert("حدث خطأ أو قيود أمان (CORS) من المتصفح");
                console.error(e);
            } finally {
                btn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
