<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HAJIB | تقارير احترافية</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #0a0f1c;
            --bg-panel: #161e31;
            --primary: #6366f1;
            --secondary: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.05);
        }

        /* منع التحرك لليمين واليسار نهائياً */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden; /* منع التمرير الأفقي للجسم */
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        /* Header */
        .header-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
            text-align: center;
        }
        @media (min-width: 768px) {
            .header-section { flex-direction: row; justify-content: space-between; text-align: right; }
        }

        .header-section h1 { font-size: 1.5rem; font-weight: 800; background: linear-gradient(to left, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .header-btns { 
            display: flex; 
            gap: 10px; 
            width: 100%; 
        }
        @media (min-width: 768px) { .header-btns { width: auto; } }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        @media (min-width: 992px) { .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        .stat-card {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-card .label { color: var(--text-muted); font-size: 0.85rem; display: block; margin-bottom: 5px; }
        .stat-card .value { font-size: 1.6rem; font-weight: 800; }

        /* Charts Row - Single Chart Now */
        .charts-row {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .chart-box {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 500px; /* جعل الرسم البياني بحجم معقول */
            min-height: 320px;
        }
        .chart-box h3 { margin-bottom: 20px; font-size: 1rem; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

        /* Table Panel */
        .report-panel {
            background: var(--bg-panel);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden; /* لضمان عدم خروج الجدول عن الحواف */
        }
        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        @media (min-width: 768px) { .panel-header { flex-direction: row; justify-content: space-between; } }

        .filters { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 5px;
        }
        .filters::-webkit-scrollbar { display: none; }

        .filter-btn {
            white-space: nowrap;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .filter-btn.active { background: var(--primary); }

        /* التحكم في تمرير الجدول فقط داخل حاويته */
        .table-res { 
            width: 100%;
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch;
        }
        table { width: 100%; border-collapse: collapse; min-width: 500px; } 
        th { background: rgba(0,0,0,0.2); padding: 12px 15px; text-align: right; color: var(--text-muted); font-size: 0.8rem; }
        td { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

        .btn-action {
            flex: 1;
            justify-content: center;
            background: var(--primary);
            color: white; border: none; padding: 12px; border-radius: 12px;
            cursor: pointer; font-family: inherit; font-weight: 600;
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
        }

        #print-only { display: none; }

        @media print {
            .dashboard-container { display: none !important; }
            #print-only { display: block !important; color: black; background: white; padding: 20px; direction: rtl; }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            .print-table th, .print-table td { border: 1px solid #000; padding: 10px; text-align: right; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Header -->
        <header class="header-section">
            <div>
                <h1><i class="fas fa-chart-pie"></i> التقارير</h1>
                <p style="color: var(--text-muted); font-size: 0.85rem;">تقرير حضور المناسبة اللحظي</p>
            </div>
            <div class="header-btns">
                <button class="btn-action" onclick="loadData()"><i class="fas fa-sync-alt"></i> تحديث</button>
                <button class="btn-action" style="background: #334155;" onclick="window.print()"><i class="fas fa-print"></i> طباعة</button>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="label">إجمالي المدعوين</span>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card" style="border-bottom: 3px solid var(--success);">
                <span class="label">حضروا فعلياً</span>
                <div class="value" id="stat-attended" style="color: var(--success);">0</div>
            </div>
            <div class="stat-card" style="border-bottom: 3px solid var(--danger);">
                <span class="label">لم يحضروا</span>
                <div class="value" id="stat-absent" style="color: var(--danger);">0</div>
            </div>
            <div class="stat-card">
                <span class="label">نسبة الحضور</span>
                <div class="value" id="stat-rate">0%</div>
            </div>
        </div>

        <!-- Charts - Removed Bar Chart -->
        <div class="charts-row">
            <div class="chart-box">
                <h3>ملخص حالة الحضور</h3>
                <div style="height: 250px; position: relative;">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="report-panel">
            <div class="panel-header">
                <h3>السجل التفصيلي</h3>
                <div class="filters">
                    <button class="filter-btn active" onclick="filterData('all', this)">الكل</button>
                    <button class="filter-btn" onclick="filterData('attended', this)">الحاضرين</button>
                    <button class="filter-btn" onclick="filterData('absent', this)">الغائبين</button>
                </div>
            </div>
            <div class="table-res">
                <table id="main-table">
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>الحالة</th>
                            <th>الوقت</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- الطباعة -->
    <div id="print-only">
        <h2 style="text-align:center">تقرير حضور المناسبة</h2>
        <hr>
        <div id="print-summary" style="margin: 20px 0; font-weight: bold;"></div>
        <table class="print-table" id="p-table">
            <thead><tr><th>الاسم</th><th>الحالة</th><th>وقت الدخول</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzcJyxjZ4DcOKkboUYvDOrkWs5PVsKScetEzEvSXwzIL3sFGb0JHHVpTzZRksiaBJsW/exec';
        let allData = [];
        let pieChart;

        async function loadData() {
            try {
                const formData = new FormData();
                formData.append('action', 'getDetailedReport');
                const res = await fetch(API_URL, { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    allData = [
                        ...data.attendedGuests.map(g => ({...g, status: 'attended'})),
                        ...data.notAttendedGuests.map(g => ({...g, status: 'absent', arrivalTime: '-'}))
                    ];
                    updateStats(data);
                    renderTable(allData);
                    renderPieChart(data.attendedCount, data.notAttendedCount);
                    preparePrint(data);
                }
            } catch (e) { alert("حدث خطأ أثناء تحميل البيانات"); }
        }

        function updateStats(data) {
            document.getElementById('stat-total').innerText = data.totalInvited;
            document.getElementById('stat-attended').innerText = data.attendedCount;
            document.getElementById('stat-absent').innerText = data.notAttendedCount;
            document.getElementById('stat-rate').innerText = ((data.attendedCount / data.totalInvited) * 100).toFixed(1) + "%";
        }

        function renderTable(list) {
            const tbody = document.querySelector('#main-table tbody');
            tbody.innerHTML = list.map(g => `
                <tr>
                    <td style="font-weight:600">${g.name}</td>
                    <td><span style="color:${g.status==='attended'?'var(--success)':'var(--danger)'}">${g.status==='attended'?'حاضر':'غائب'}</span></td>
                    <td style="color:var(--text-muted)">${g.arrivalTime}</td>
                </tr>
            `).join('');
        }

        function filterData(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable(type === 'all' ? allData : allData.filter(g => g.status === type));
        }

        function renderPieChart(att, abs) {
            const ctx = document.getElementById('pieChart').getContext('2d');
            if(pieChart) pieChart.destroy();
            pieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['حاضر', 'غائب'],
                    datasets: [{
                        data: [att, abs],
                        backgroundColor: ['#6366f1', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#fff', font: { family: 'Tajawal' } } }
                    }
                }
            });
        }

        function preparePrint(data) {
            document.getElementById('print-summary').innerText = 
                `إجمالي المدعوين: ${data.totalInvited} | عدد الحضور: ${data.attendedCount} | نسبة الحضور: ${((data.attendedCount/data.totalInvited)*100).toFixed(1)}%`;
            const pt = document.querySelector('#p-table tbody');
            pt.innerHTML = allData.map(g => `
                <tr>
                    <td>${g.name}</td>
                    <td>${g.status==='attended'?'حاضر':'غائب'}</td>
                    <td>${g.arrivalTime}</td>
                </tr>
            `).join('');
        }

        window.onload = loadData;
    </script>
</body>
</html>
